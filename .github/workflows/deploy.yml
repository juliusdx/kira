name: Deploy Kira to GitHub Pages

on:
  push:
    branches: [main]
  # `main` is protected and requires the `build` check to pass before a pull
  # request can merge, so the suite has to actually RUN on pull requests.
  # Without this trigger every PR would sit forever waiting for a check that
  # never starts, and the protection would read as "nothing can ever merge".
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ref-scoped, so a PR build never queues behind a production deploy or vice
# versa. Production still serialises against itself, which is the property the
# original single `pages` group existed for.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          # Repository variables, not secrets: both values are inlined into the
          # public client bundle by design. RLS is the actual boundary.
          # If either is unset the build simply ships without cloud sync.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # VAPID *public* key only — it is meant to be in the client bundle.
          # The private key lives solely in the Edge Function's secrets.
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # NEVER publish a pull request. On a PR this workflow exists only to run
    # the suite as the required check; the live site is built from `main`.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
